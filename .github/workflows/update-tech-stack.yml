name: Update profile tech stack

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_tech_stack.py"
      - ".github/workflows/update-tech-stack.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate README tech stack
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_tech_stack.py
      - name: Commit README if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git diff --cached --quiet || git commit -m "Update detected tech stack"
          git push
